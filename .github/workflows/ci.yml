name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Check fatal lint errors
        run: python -m ruff check --select E9,F63,F7,F82 .
      - name: Run tests
        run: python -m pytest -q

  windows-package:
    name: Windows package smoke test
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install packaging dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build Windows package
        run: pyinstaller --noconfirm --clean packaging/snapsort.spec
      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/SnapSort/SnapSort.exe')) {
            throw 'SnapSort.exe was not created'
          }
          $privateFiles = Get-ChildItem 'dist/SnapSort' -Recurse -File | Where-Object {
            $_.FullName -match 'snapsort_config|history\.json|ref_images|thumbnails|snapsort\.log'
          }
          if ($privateFiles) {
            throw 'Private runtime data was included in the package'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: SnapSort-Windows
          path: dist/SnapSort/
          if-no-files-found: error
